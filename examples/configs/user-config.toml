# Your user configuration (`repodna config path` prints where it lives).
# Only this file, --config, and command-line options can enable plugins and command
# execution; a repository's repodna.toml cannot.

[analysis]
profile = "standard"

[privacy]
# Replace contributor names with pseudonyms in stored analyses.
anonymize_contributors = false

[performance]
parallelism = "auto"

[plugins]
# Plugins run only when enabled by name. See docs/plugins.md.
enabled = ["license-headers"]

[execution]
# Run detected test commands (not build commands) during analysis.
allow_build_commands = false
allow_test_commands = true
timeout_seconds = 600

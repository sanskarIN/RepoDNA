# Serves the RepoDNA web interface. The interface is a static application: analyses are
# opened in the browser and never sent to this server, so the server only sends files.
server {
    # IPv4 only: an IPv6 listener stops nginx from starting where IPv6 is turned off, and
    # published container ports reach it either way.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The headers `repodna serve` sends with the same interface.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The names of built files change with their content, so they can be kept for a year.
    location /assets/ {
        expires 1y;
    }

    # The page itself is checked on every visit, so a new image takes effect at once.
    location = /index.html {
        expires -1;
    }
}

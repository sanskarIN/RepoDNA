[package]
name = "repodna-server"
description = "The RepoDNA local server: a token-protected JSON API and the web interface, bound to this machine only."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
repodna-core.workspace = true
repodna-engine.workspace = true
repodna-store.workspace = true
repodna-report.workspace = true
repodna-app.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
repodna-testkit.workspace = true

[features]
default = ["embed-web"]
# Embeds the built web interface (apps/web/dist) when it exists. The desktop app turns this
# off because it ships the interface itself.
embed-web = []

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop shell has its own workspace so that the core CLI can be built and
# tested without the platform WebView SDKs that Tauri requires.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Sanskar"]
repository = "https://github.com/sanskarIN/RepoDNA"
homepage = "https://github.com/sanskarIN/RepoDNA"
publish = false

[workspace.dependencies]
# Internal crates
repodna-core = { path = "crates/repodna-core", version = "1.0.0" }
repodna-parser = { path = "crates/repodna-parser", version = "1.0.0" }
repodna-discovery = { path = "crates/repodna-discovery", version = "1.0.0" }
repodna-git = { path = "crates/repodna-git", version = "1.0.0" }
repodna-dependencies = { path = "crates/repodna-dependencies", version = "1.0.0" }
repodna-architecture = { path = "crates/repodna-architecture", version = "1.0.0" }
repodna-quality = { path = "crates/repodna-quality", version = "1.0.0" }
repodna-security = { path = "crates/repodna-security", version = "1.0.0" }
repodna-project = { path = "crates/repodna-project", version = "1.0.0" }
repodna-evolution = { path = "crates/repodna-evolution", version = "1.0.0" }
repodna-testkit = { path = "crates/repodna-testkit" }

# Serialization and configuration
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
schemars = "1.2.2"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Hashing
sha2 = "0.11.0"

# Text processing
regex = "1.13.1"
yaml-rust2 = { version = "0.13.0", default-features = false }

# File system and archives
ignore = "0.4.33"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
tar = "0.4.46"
flate2 = "1.1.10"

# Testing
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[package]
name = "repodna-desktop"
version = "1.0.0"
description = "The RepoDNA desktop app: repository intelligence in a native window, entirely on your machine."
authors = ["Sanskar"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sanskarIN/RepoDNA"
publish = false

[[bin]]
name = "repodna-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
repodna-app = { path = "../../../crates/repodna-app" }
repodna-core = { path = "../../../crates/repodna-core" }
repodna-report = { path = "../../../crates/repodna-report" }
# The window shows the web interface itself, so the server crate need not embed a copy.
repodna-server = { path = "../../../crates/repodna-server", default-features = false }
repodna-store = { path = "../../../crates/repodna-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"

[features]
# Embeds the built web interface instead of loading the development server.
# `cargo tauri build` turns this on; use `cargo build --features custom-protocol` without the CLI.
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
# Code generated by Tauri's macros may allow unsafe code locally, so this is deny, not forbid.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

name: Publish RepoDNA v1.4.0 once

# Runs exactly when this release handoff is merged into main. The release's actual
# build and publishing are handled by the existing, separately tested release.yml.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v140.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-v1.4.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sanskarIN/RepoDNA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the exact version and release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "repodna-cli") | .version')" = "1.4.0"
          grep -Fqx '## [1.4.0] - 2026-10-15' CHANGELOG.md
          test "$(git branch --show-current || true)" != "release-v1.4.0-prep"
      - name: Verify official v1.4.0 release imagery is available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/images:refs/remotes/origin/images
          for path in \
            media/v1.4.0/promo/launch-16x9.png \
            media/v1.4.0/cards/dna-card-light.png \
            media/v1.4.0/cards/dna-card-dark.png \
            screenshots/v1.4.0/desktop/overview-light.png \
            screenshots/v1.4.0/desktop/overview-dark.png \
            screenshots/v1.4.0/desktop/architecture-dark.png \
            screenshots/v1.4.0/phone/overview-light.png \
            screenshots/v1.4.0/docs-site/index-light.png \
            screenshots/v1.4.0/docs-site/cli-dark.png \
            screenshots/v1.4.0/docs-site/phone-dark.png
          do
            git cat-file -e "refs/remotes/origin/images:$path" || {
              echo "::error::Missing image: $path"
              exit 1
            }
            bytes=$(git cat-file -s "refs/remotes/origin/images:$path")
            test "$bytes" -gt 1000 || { echo "::error::Image is too small: $path"; exit 1; }
            echo "$path ($bytes bytes)"
          done
      - name: Create annotated v1.4.0 tag if absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.4.0; then
            actual=$(git rev-list -n 1 v1.4.0)
            test "$actual" = "$GITHUB_SHA" || { echo "v1.4.0 already exists at a different commit." >&2; exit 1; }
          else
            git config user.name "RepoDNA release maintenance"
            git config user.email "sanskarin@oulook.in"
            git tag -a v1.4.0 -m "RepoDNA 1.4.0"
            git push origin refs/tags/v1.4.0
          fi
      - name: Dispatch the existing release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub does not trigger other push workflows for GITHUB_TOKEN tag pushes.
          # A workflow_dispatch is allowed and builds the exact v1.4.0 tag.
          gh workflow run release.yml --ref main --field tag=v1.4.0

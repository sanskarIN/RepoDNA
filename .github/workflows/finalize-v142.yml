name: Finalize RepoDNA v1.4.2 stable

# Runs when this reviewed workflow merges to main. No tag is created unless
# this precise main commit passes both CI and CodeQL.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v142.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: repodna-v1.4.2-stable
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'sanskarIN/RepoDNA'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tagged release metadata
        shell: bash
        run: |
          set -euo pipefail
          node packaging/release/check-version.mjs
          test "$(node -p 'require("./package.json").version')" = 1.4.2
          grep -Fqx '## [1.4.2] - 2026-10-20' CHANGELOG.md
          node --test packaging/winget/test/*.test.mjs
      - name: Wait for CI and CodeQL on this exact main commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'") | [.name, .status, .conclusion] | @tsv')"
            failed="$(printf '%s\n' "$runs" | awk -F '\t' '($1=="CI" || $1=="CodeQL Advanced") && $2=="completed" && $3!="success" {print $1": "$3}')"
            if [ -n "$failed" ]; then
              echo "::error::Required post-merge check failed: $failed"
              exit 1
            fi
            ci_ok="$(printf '%s\n' "$runs" | awk -F '\t' '$1=="CI" && $2=="completed" && $3=="success" {print 1;exit}')"
            codeql_ok="$(printf '%s\n' "$runs" | awk -F '\t' '$1=="CodeQL Advanced" && $2=="completed" && $3=="success" {print 1;exit}')"
            if [ "$ci_ok" = 1 ] && [ "$codeql_ok" = 1 ]; then
              echo '::notice::Main branch CI and CodeQL passed.'
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo '::error::Timed out waiting for green main branch checks.'
              exit 1
            fi
            sleep 15
          done
      - name: Dry-run every release artifact before creating the immutable tag
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release.yml --ref main --field tag=
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=40" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'" and .created_at >= "'"$started_at"'") | .id' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '::error::Cannot find the dry-run release build.'
            exit 1
          fi
          echo "::notice::Full release dry run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          # Trials build Windows installers, CLI, macOS, Linux, npm archives,
          # WebAssembly, the container and WinGet manifest ZIP, but publish none.
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - name: Create stable v1.4.2 tag, never overwrite an existing tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.4.2; then
            actual="$(git rev-list -n 1 v1.4.2)"
            if [ "$actual" != "$GITHUB_SHA" ]; then
              echo '::error::Existing v1.4.2 tag points to another commit.'
              exit 1
            fi
          else
            git config user.name 'Sanskar'
            git config user.email 'sanskarin@outlook.in'
            git tag -a v1.4.2 -m 'RepoDNA v1.4.2 stable'
            git push origin refs/tags/v1.4.2
          fi
      - name: Dispatch existing release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main --field tag=v1.4.2
          echo '::notice::Multi-platform stable release build dispatched.'

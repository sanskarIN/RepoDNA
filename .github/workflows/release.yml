name: Release

# Builds and publishes a release when a version tag is pushed: the command line for every
# platform, the desktop installers, and the container image on ghcr.io. Running it by hand
# with an existing tag rebuilds that tag's code and updates the release's files. Running it
# by hand without a tag is a trial: it builds every file from the selected branch and keeps
# them as downloads of the run, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, such as v1.0.0. Leave it empty for a trial build of the selected branch.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      # What every job builds: the full tag ref (never a branch of the same name) or, for a
      # trial, the exact commit.
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - id: version
        env:
          # Empty for a trial started by hand without a tag.
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          workspace=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "repodna-cli") | .version')
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            if [ "$version" != "$workspace" ]; then
              echo "The tag $TAG does not match the workspace version $workspace."
              exit 1
            fi
            ref="refs/tags/$TAG"
            publish=true
          else
            version="$workspace"
            ref=$(git rev-parse HEAD)
            publish=false
            echo "Trial build of $version from $GITHUB_REF_NAME at $ref; nothing is published."
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "ref=$ref"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Web interface
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @repodna/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  cli:
    name: Command line (${{ matrix.target }})
    needs: [prepare, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      # The binary embeds the web interface served by `repodna serve`.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Record the commit
        # Shown by `repodna version --json`.
        shell: bash
        run: echo "REPODNA_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build
        env:
          # Link the C runtime statically so the Windows binary needs no Visual C++ runtime.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p repodna-cli --target ${{ matrix.target }}
      - name: Check the binary
        # The x86_64 macOS binary is cross-compiled on an Arm runner.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/repodna --version
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="repodna-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md CHANGELOG.md "dist/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/repodna.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/repodna" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-targets: ""
            bundle-args: ""
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-args: --target universal-apple-darwin
          - os: windows-latest
            rust-targets: ""
            bundle-args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      # Builds the web interface first (Tauri's beforeBuildCommand) and embeds it.
      - name: Build the installers
        run: npm run bundle -w @repodna/desktop -- ${{ matrix.bundle-args }}
      - name: Check the app signature
        # The ad-hoc signature must cover the whole bundle: macOS reports a downloaded app
        # without one as damaged, instead of offering to open it from Privacy & Security.
        if: runner.os == 'macOS'
        run: |
          app=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/RepoDNA.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  container:
    name: Container image
    needs: [prepare, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*-linux-musl
          path: archives
          merge-multiple: true
      - name: Prepare the build context
        # The static Linux binaries of this release, and the license files.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/image"
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            name="repodna-$VERSION-${pair#*:}-unknown-linux-musl"
            tar -xzf "archives/$name.tar.gz" -C "$RUNNER_TEMP"
            mkdir -p "$context/$arch"
            cp "$RUNNER_TEMP/$name/repodna" "$context/$arch/repodna"
          done
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.txt "$context/"
          echo "CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Set up emulation and Buildx
        # Installing Git into the arm64 image runs under emulation on this x86_64 runner.
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name repodna
      - name: Test the image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --tag repodna:test \
            --file packaging/container/Dockerfile "$CONTEXT"
          docker run --rm repodna:test --version
          docker run --rm --volume "$PWD:/work" repodna:test analyze . --profile quick --no-store --quiet > /dev/null
      - name: Log in to the GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build for amd64 and arm64, and push a release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repodna"
          tags=(--tag "$image:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            major="${VERSION%%.*}"
            minor="${VERSION#*.}"
            minor="${minor%%.*}"
            tags+=(--tag "$image:$major.$minor" --tag "$image:$major" --tag "$image:latest")
          fi
          push=()
          if [ "$PUBLISH" = true ]; then
            push=(--push)
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${tags[@]}" "${push[@]}" --file packaging/container/Dockerfile "$CONTEXT"

  publish:
    name: Publish the release
    needs: [prepare, cli, desktop, container]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The version's section of the changelog, without the link definitions at its end.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          - `repodna-<version>-<target>`: the `repodna` command line, with the web interface of
            `repodna serve` built in. The Linux builds are static and run on any distribution.
          - `RepoDNA_<version>_amd64.deb`, `RepoDNA-<version>-1.x86_64.rpm`,
            `RepoDNA_<version>_universal.dmg`, `RepoDNA_<version>_x64_en-US.msi`, and
            `RepoDNA_<version>_x64-setup.exe`: the desktop app.
          - `ghcr.io/sanskarin/repodna:<version>`: a container image with the command line and
            Git, for CI jobs: `docker run --rm -v "$PWD:/work" ghcr.io/sanskarin/repodna analyze .`
          - `SHA256SUMS.txt`: checksums of every file.

          EOF
          echo "The binaries are not code-signed, so macOS and Windows ask for confirmation the first time they start; see the [installation guide](https://github.com/sanskarIN/RepoDNA/blob/$TAG/docs/installation.md)." >> notes.md
          sed -i "s/<version>/$VERSION/g" notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "RepoDNA $VERSION" --notes-file notes.md
          fi

name: RepoDNA v1.5.2 one-time publication gate

# Authorized one-time v1.5.2 publication workflow, hosted only on an ops
# branch. Its job cannot create a tag until all exact candidate checks succeed.
on:
  push:
    branches: [ops/publish-v1.5.2-20261120]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.repository == 'sanskarIN/RepoDNA'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: repodna-v1.5.2-single-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: 5832b9818c5cb657a9238180feefb72e0c6b2d8e
      RELEASE_TAG: v1.5.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Verify owner-approved release source and complete checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "sanskarIN/RepoDNA"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/283")
          jq -e --arg sha "$CANDIDATE_SHA" '
            .head.sha == $sha and
            .base.ref == "maintenance/v1.5.x" and
            .state == "open" and
            .merged == false
          ' <<< "$pr" >/dev/null
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v1.5.2-candidate" --jq '.object.sha')
          test "$head_sha" = "$CANDIDATE_SHA"
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          test "$(git show "$CANDIDATE_SHA:package.json" | jq -r '.version')" = "1.5.2"
          git show "$CANDIDATE_SHA:CHANGELOG.md" | grep -q '^## \[1.5.2\] - 2026-11-20$'
          # Wait for all three independent checks of the *same* candidate SHA.
          # A failed check is terminal; pending checks can continue for up to
          # 55 minutes without letting an unverified tag be created.
          ready=false
          for attempt in $(seq 1 165); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")
            count=0
            for spec in 'CI:pull_request' 'CodeQL Advanced:pull_request' 'Release:push'; do
              name="${spec%:*}"
              event="${spec##*:}"
              conclusion=$(jq -r --arg sha "$CANDIDATE_SHA" --arg name "$name" --arg event "$event" '
                [.workflow_runs[] |
                 select(.head_sha == $sha and .name == $name and .event == $event)] |
                 sort_by(.created_at) | last | .conclusion // "pending"
              ' <<< "$runs")
              case "$conclusion" in
                success) count=$((count + 1)) ;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::$name/$event concluded $conclusion for $CANDIDATE_SHA."
                  exit 1 ;;
                *) echo "$name/$event is $conclusion on attempt $attempt." ;;
              esac
            done
            if [ "$count" -eq 3 ]; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true || {
            echo "::error::Required exact-SHA CI, CodeQL and Release trial did not finish successfully."
            exit 1
          }
          # Detect a race in the candidate branch or PR before tagging.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v1.5.2-candidate" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/283" --jq '.head.sha')" = "$CANDIDATE_SHA"
          echo "v1.5.2 exact-SHA CI, CodeQL and unpublished release inventory verified."

      - name: Create exact source tag if absent
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            test "$remote_sha" = "$CANDIDATE_SHA" || {
              echo "::error::The existing release tag points at a different commit."
              exit 1
            }
            echo "The exact validated tag already exists."
          else
            git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
            git tag "$RELEASE_TAG" "$CANDIDATE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Start the GitHub stable release workflow for that tag
        shell: bash
        run: |
          set -euo pipefail
          # Tag pushes using GITHUB_TOKEN do not trigger subsequent workflows.
          # workflow_dispatch does, and release.yml checks out the tag itself.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field "tag=$RELEASE_TAG"
          echo "Dispatched the stable release build from $RELEASE_TAG."

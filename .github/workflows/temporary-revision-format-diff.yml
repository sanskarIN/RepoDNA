name: Temporary revision format diagnosis

on:
  push:
    branches:
      - feat/revision-aware-remote-analysis-20261116

permissions:
  contents: read

jobs:
  inspect-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx prettier --write apps/web/src/lib/backend.test.ts
      - name: Print only formatting patch
        run: git diff -- apps/web/src/lib/backend.test.ts

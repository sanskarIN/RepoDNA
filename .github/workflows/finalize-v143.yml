name: Finalize RepoDNA v1.4.3 stable

# Runs only when this reviewed one-shot workflow is merged into main.
# Wait for CI, CodeQL and an unpublished release trial before tagging.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v143.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: repodna-v1.4.3-stable
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'sanskarIN/RepoDNA'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify exact release metadata and portable installer checks
        shell: bash
        run: |
          set -euo pipefail
          node packaging/release/check-version.mjs
          test "$(node -p 'require("./package.json").version')" = 1.4.3
          grep -Fqx '## [1.4.3] - 2026-10-23' CHANGELOG.md
          test "$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')" = 1.4.3
          npm run links:check
          node --test packaging/winget/test/*.test.mjs

      - name: Wait for CI and CodeQL on this exact main commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'") | [.name, .status, .conclusion] | @tsv')"
            failed="$(printf '%s\n' "$runs" | awk -F '\t' '($1=="CI" || $1=="CodeQL Advanced") && $2=="completed" && $3!="success" {print $1": "$3}')"
            if [ -n "$failed" ]; then
              echo "::error::Required post-merge check failed: $failed"
              exit 1
            fi
            ci_ok="$(printf '%s\n' "$runs" | awk -F '\t' '$1=="CI" && $2=="completed" && $3=="success" {print 1;exit}')"
            codeql_ok="$(printf '%s\n' "$runs" | awk -F '\t' '$1=="CodeQL Advanced" && $2=="completed" && $3=="success" {print 1;exit}')"
            if [ "$ci_ok" = 1 ] && [ "$codeql_ok" = 1 ]; then
              echo '::notice::Main CI and CodeQL passed.'
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo '::error::Timed out waiting for green main checks.'
              exit 1
            fi
            sleep 15
          done

      - name: Build and validate every release artifact without publishing
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release.yml --ref main --field tag=
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=40" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'" and .created_at >= "'"$started_at"'") | .id' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '::error::Cannot find the unpublished release trial.'
            exit 1
          fi
          echo "::notice::Unpublished release trial: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20

      - name: Create immutable stable v1.4.3 tag
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f 1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Main moved since verification; refusing to tag an outdated commit."
            exit 1
          fi
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.4.3; then
            actual="$(git rev-list -n 1 v1.4.3)"
            if [ "$actual" != "$GITHUB_SHA" ]; then
              echo '::error::Existing v1.4.3 tag points at another commit.'
              exit 1
            fi
          else
            git config user.name 'Sanskar'
            git config user.email 'sanskarin@outlook.in'
            git tag -a v1.4.3 -m 'RepoDNA v1.4.3 stable'
            git push origin refs/tags/v1.4.3
          fi

      - name: Dispatch the verified stable release build
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag pushes cannot trigger another workflow; workflow_dispatch can.
          gh workflow run release.yml --ref main --field tag=v1.4.3
          echo '::notice::Stable v1.4.3 release publication dispatched.'

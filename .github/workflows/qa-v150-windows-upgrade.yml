name: v1.5.0 Windows MSI upgrade qualification

on:
  push:
    branches:
      - qa/v1.5.0-msi-upgrade

permissions:
  contents: read
  actions: read

jobs:
  windows-msi-upgrade:
    name: Verify v1.4.5 to v1.5.0 MSI upgrade and uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the exact unpublished candidate installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloaded = $false
          for ($attempt = 1; $attempt -le 24; $attempt++) {
            if (Test-Path -LiteralPath dist) {
              Remove-Item -LiteralPath dist -Recurse -Force
            }
            gh run download 42050883059 --repo sanskarIN/RepoDNA --name desktop-Windows --dir dist
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath 'dist/RepoDNA_1.5.0_x64_en-US.msi' -PathType Leaf)) {
              $downloaded = $true
              break
            }
            if ($attempt -lt 24) { Start-Sleep -Seconds 15 }
          }
          if (-not $downloaded) {
            throw 'Missing v1.5.0 x64 MSI from the frozen unpublished release trial'
          }
      - name: Verify real MSI upgrade, clean install and uninstall
        shell: pwsh
        run: ./packaging/release/test/windows-msi-upgrade.ps1 -CandidateMsi 'dist/RepoDNA_1.5.0_x64_en-US.msi'
      - name: Verify the NSIS installer, branding and uninstall
        shell: pwsh
        run: ./packaging/release/test/windows-nsis-smoke.ps1 -Installer 'dist/RepoDNA_1.5.0_x64-setup.exe'

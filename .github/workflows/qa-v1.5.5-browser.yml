name: v1.5.5 browser acceptance (isolated QA)
on:
  push:
    branches: ["qa/v1.5.5-browser-20261128"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 0508a2f4ef3c89cb7ae5766231ea2db3715dd930
      CANDIDATE_RUN: "46100587917"
    steps:
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .head_sha | grep -Fx "$CANDIDATE_SHA"
          for attempt in $(seq 1 120); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "Web interface") | .conclusion // ""')
            if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
              echo "Candidate web job failed: $conclusion" >&2
              exit 1
            fi
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "web-dist" and .expired == false) | .id')
            if [ "$conclusion" = success ] && [[ "$artifact" =~ ^[0-9]+$ ]]; then
              echo "WEB_ARTIFACT_ID=$artifact" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for exact candidate web artifact" >&2
          exit 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 46100587917
          name: web-dist
          path: ${{ runner.temp }}/repodna-web
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the candidate in a real browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-qa"
          cd "$RUNNER_TEMP/browser-qa"
          npm install --no-save --ignore-scripts playwright@1.56.1
          test -s "$RUNNER_TEMP/repodna-web/index.html"
          test -s "$RUNNER_TEMP/repodna-web/demo/repodna.json"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/repodna-web" > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          cat > acceptance.mjs <<'JS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { join } from "node:path";
          import { randomUUID } from "node:crypto";
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:8765/";
          const fixture = JSON.parse(await readFile(join(process.env.RUNNER_TEMP, "repodna-web/demo/repodna.json"), "utf8"));
          const browser = await chromium.launch({ channel: "chrome", headless: true });
          const checks = [];
          const pass = (name) => { checks.push(name); console.log("PASS:", name); };
          const context = await browser.newContext();
          const page = await context.newPage();
          const names = [];
          const ids = [];
          async function go(route) {
            await page.evaluate(hash => { location.hash = hash; }, "#" + route);
            await page.waitForURL(url => url.hash === "#" + route);
          }
          // Hold the real IndexedDB write lock without modifying data. Each
          // request queues the next synchronously, keeping the transaction active.
          // A bounded fallback releases it if a browser assertion fails.
          async function holdWriteLock() {
            await page.evaluate(async () => {
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open("repodna", 1);
                request.onupgradeneeded = () => {
                  request.result.createObjectStore("recent", { keyPath: "id" });
                  request.result.createObjectStore("texts", { keyPath: "id" });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              await new Promise((resolve, reject) => {
                const tx = db.transaction(["recent", "texts"], "readwrite");
                const store = tx.objectStore("recent");
                let held = true;
                window.__repodnaQaRelease = () => { held = false; };
                const timer = setTimeout(window.__repodnaQaRelease, 20000);
                tx.oncomplete = () => { clearTimeout(timer); db.close(); };
                tx.onabort = () => { clearTimeout(timer); db.close(); reject(tx.error); };
                const cycle = () => {
                  const request = store.get("__repodna_qa_lock__");
                  request.onsuccess = () => {
                    resolve();
                    if (held) cycle();
                  };
                };
                cycle();
              });
            });
          }
          async function releaseWriteLock() {
            await page.evaluate(() => window.__repodnaQaRelease());
          }
          async function rows() {
            const section = page.getByRole("region", { name: "Recent analyses" });
            return section.locator("li .path").allTextContents();
          }
          async function expectRows(expected) {
            await page.waitForFunction(expected => {
              const section = document.querySelector('section[aria-labelledby="recent-title"]');
              const actual = section ? [...section.querySelectorAll("li .path")].map(node => node.textContent) : [];
              return JSON.stringify(actual) === JSON.stringify(expected);
            }, expected);
            assert.deepEqual(await rows(), expected);
          }
          try {
            await page.goto(base + "#/");
            const announcement = page.getByRole("dialog", { name: "What's New in RepoDNA v1.5.5" });
            await announcement.getByRole("button", { name: "Continue to RepoDNA" }).click();
            await announcement.waitFor({ state: "hidden" });
            assert.equal(await page.evaluate(() => localStorage.getItem("repodna-whats-new-seen")), "1.5.5");
            pass("First-run announcement is dismissible and records the correct release version");
            for (let i = 1; i <= 6; i++) {
              const copy = structuredClone(fixture);
              const id = randomUUID();
              const name = "acceptance-" + i + ".json";
              copy.analysisMetadata.id = id;
              names.unshift(name);
              ids.unshift(id);
              if (i === 1) await holdWriteLock();
              await page.getByLabel("Open an analysis file", { exact: true }).setInputFiles({
                name, mimeType: "application/json", buffer: Buffer.from(JSON.stringify(copy)),
              });
              await page.waitForURL(url => url.hash === "#/overview");
              if (i === 1) {
                assert.equal(await page.evaluate(() => sessionStorage.getItem("repodna-open")), null);
                await releaseWriteLock();
                await page.waitForFunction(id => {
                  const raw = sessionStorage.getItem("repodna-open");
                  return raw && JSON.parse(raw).id === id;
                }, id);
                pass("File reload pointer is set only after a real delayed IndexedDB write commits");
              }
              await go("/");
              await expectRows(names.slice(0, 5));
            }
            pass("Six distinct analysis uploads retain the newest five");
            const section = page.getByRole("region", { name: "Recent analyses" });
            await section.getByRole("listitem").filter({ hasText: names[2] }).getByRole("button", { name: "Open", exact: true }).click();
            await page.waitForURL(url => url.hash === "#/overview");
            await go("/");
            const refreshed = [names[2], names[0], names[1], names[3], names[4]];
            await expectRows(refreshed);
            pass("Reopening at capacity preserves five distinct records and refreshes recency");
            await go("/files");
            await page.reload();
            await page.getByRole("heading", { name: "Files", exact: true, level: 1 }).waitFor();
            assert.equal(await page.getByText("No analysis is open", { exact: true }).count(), 0);
            pass("Retained file restores after a real reload");
            await go("/");
            await holdWriteLock();
            await section.getByRole("listitem").filter({ hasText: names[1] }).getByRole("button", { name: "Open", exact: true }).click();
            await section.getByRole("button", { name: "Remove " + names[1] + " from recent analyses" }).click();
            await releaseWriteLock();
            await expectRows(refreshed.filter(name => name !== names[1]));
            assert.equal(new URL(page.url()).hash, "#/");
            pass("Deleting a file during a blocked real IndexedDB read does not navigate or restore it");
            const other = await context.newPage();
            await other.goto(base + "#/");
            const otherSection = other.getByRole("region", { name: "Recent analyses" });
            await otherSection.getByText(names[0], { exact: true }).waitFor();
            assert.equal(await otherSection.getByText(names[1], { exact: true }).count(), 0);
            pass("Independent same-origin page observes committed deletion");
            await other.evaluate(() => { location.hash = "#/settings"; });
            const otherKeep = other.getByRole("checkbox", { name: /Keep the last \d+ analysis files/ });
            await otherKeep.waitFor();
            assert.equal(await otherKeep.isChecked(), true);
            await go("/settings");
            const keep = page.getByRole("checkbox", { name: /Keep the last \d+ analysis files/ });
            await keep.uncheck();
            await page.getByText("None kept.", { exact: true }).waitFor();
            await other.waitForFunction(() => {
              const checkbox = document.querySelector('input[type="checkbox"]');
              return checkbox && !checkbox.checked;
            });
            assert.equal(await otherKeep.isChecked(), false);
            await other.getByText("None kept.", { exact: true }).waitFor();
            await other.close();
            pass("Retention opt-out synchronizes to an already open same-origin tab");
            await page.reload();
            await keep.waitFor();
            assert.equal(await keep.isChecked(), false);
            await page.getByText("None kept.", { exact: true }).waitFor();
            const count = await page.evaluate(async () => {
              const db = await new Promise((resolve, reject) => {
                const r = indexedDB.open("repodna", 1);
                r.onsuccess = () => resolve(r.result);
                r.onerror = () => reject(r.error);
              });
              const result = await new Promise((resolve, reject) => {
                const tx = db.transaction(["recent", "texts"]);
                const a = tx.objectStore("recent").count();
                const b = tx.objectStore("texts").count();
                tx.oncomplete = () => resolve([a.result, b.result]);
                tx.onabort = () => reject(tx.error);
                tx.onerror = () => reject(tx.error);
              });
              db.close();
              return result;
            });
            assert.deepEqual(count, [0, 0]);
            await go("/files");
            await page.reload();
            await page.getByText("No analysis is open", { exact: true }).waitFor();
            pass("Retention opt-out persists and both IndexedDB object stores are empty");
            console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, artifact: process.env.WEB_ARTIFACT_ID, checks }, null, 2));
          } finally {
            await browser.close();
          }
          JS
          node acceptance.mjs 2>&1 | tee browser-acceptance.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v1.5.5-browser-acceptance-log
          path: ${{ runner.temp }}/browser-qa/browser-acceptance.log
          if-no-files-found: warn

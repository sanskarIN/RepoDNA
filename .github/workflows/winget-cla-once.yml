name: Complete authorized Microsoft WinGet CLA confirmation

# One-time owner-authorized action for the two RepoDNA v1.4.1 PRs only.
# Remove this file after the CLA bot has confirmed the responses.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/winget-cla-once.yml

permissions:
  contents: read

jobs:
  confirm-cla:
    name: Post the explicitly authorized CLA confirmation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: \${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - name: Confirm account, PR identities, and comment only when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Owner's WinGet submission PAT is not configured."
            exit 1
          fi
          login="$(gh api user --jq .login)"
          if [ "$login" != sanskarIN ]; then
            echo "::error::Token is not owned by sanskarIN; refusing to acknowledge a legal agreement from the wrong account."
            exit 1
          fi
          for pair in '453917:repodna-v1.4.1-desktop' '453918:repodna-v1.4.1-cli'; do
            pr="\${pair%%:*}"
            branch="\${pair#*:}"
            url="repos/microsoft/winget-pkgs/pulls/$pr"
            owner="$(gh api "$url" --jq '.head.repo.full_name')"
            head="$(gh api "$url" --jq '.head.ref')"
            state="$(gh api "$url" --jq '.state')"
            if [ "$owner" != 'sanskarIN/winget-pkgs' ] || [ "$head" != "$branch" ]; then
              echo "::error::Unexpected upstream pull request #$pr; refusing to post."
              exit 1
            fi
            if [ "$state" != open ]; then
              echo "::notice::Pull request #$pr is no longer open; skipping."
              continue
            fi
            existing="$(gh api --paginate "repos/microsoft/winget-pkgs/issues/$pr/comments?per_page=100" \
              --jq '.[] | select(.user.login == "sanskarIN" and .body == "@microsoft-github-policy-service agree") | .id' | head -n 1)"
            if [ -n "$existing" ]; then
              echo "::notice::CLA confirmation already posted by sanskarIN on #$pr; skipping duplicate."
              continue
            fi
            comment_url="$(gh api -X POST "repos/microsoft/winget-pkgs/issues/$pr/comments" \
              -f body='@microsoft-github-policy-service agree' --jq .html_url)"
            echo "::notice::Posted owner's authorized CLA declaration to $comment_url"
          done

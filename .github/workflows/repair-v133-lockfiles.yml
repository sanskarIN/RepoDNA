name: Repair v1.3.3 Cargo lockfiles

on:
  push:
    branches: [release-v1.3.3-prep]
    paths:
      - .github/workflows/repair-v133-lockfiles.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v1.3.3-prep
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.46
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml -p rustls --precise 0.23.46
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          git diff --check
      - name: Commit resolved lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Both lockfiles are already up to date."
            exit 0
          fi
          git config user.name "RepoDNA release maintenance"
          git config user.email "sanskarin@oulook.in"
          git commit -m "fix(deps): upgrade rustls to address security advisories"
          git push origin HEAD:release-v1.3.3-prep

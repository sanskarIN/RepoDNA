name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --locked

  web:
    name: Web interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the third-party notices
        # The licenses of the crates and npm packages that downloads include.
        run: cargo xtask notices --check
      - name: Check the generated schema types
        run: npm run check-generated -w @repodna/schema
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build -w @repodna/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      # The app embeds the built web interface.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features custom-protocol --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --locked

  dependencies:
    name: Dependencies (${{ matrix.tree }}, ${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree: [workspace, desktop]
        checks: [advisories, bans licenses sources]
    # A newly published advisory shows as a failed job without blocking unrelated changes.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.tree == 'desktop' && 'apps/desktop/src-tauri/Cargo.toml' || 'Cargo.toml' }}
          command: check ${{ matrix.checks }}

  smoke:
    name: Release build smoke test
    needs: web
    runs-on: ubuntu-latest
    env:
      REPODNA_HOME: ${{ github.workspace }}/../repodna-home
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p repodna-cli
      - name: Generate the fixture repositories
        run: cargo xtask fixtures --large-files 500 --large-commits 10
      - name: Analyze, report, export, and import
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          repodna() { ./target/release/repodna "$@"; }
          repodna --version
          repodna doctor --export "$out/diagnostics.zip"
          test -s "$out/diagnostics.zip"
          for fixture in fixtures/generated/*/; do
            repodna analyze "$fixture" --quiet > /dev/null
          done
          repodna analyze . --profile deep > /dev/null
          repodna list
          repodna report polyglot --output "$out/report"
          for file in index.html report.md repodna.json dna-card.svg dna-card.png; do
            test -s "$out/report/$file"
          done
          repodna card polyglot --format png --output "$out/card.png"
          test -s "$out/card.png"
          repodna export polyglot --output "$out/polyglot.repodna"
          REPODNA_HOME="$RUNNER_TEMP/other-home" ./target/release/repodna import "$out/polyglot.repodna"
      - name: Fail CI on findings
        run: |
          set -euo pipefail
          ./target/release/repodna ci fixtures/generated/tiny --fail-on critical
          # Written to a file so that the fixture's fake secrets do not become annotations here.
          annotations="$RUNNER_TEMP/annotations.txt"
          status=0
          ./target/release/repodna ci fixtures/generated/secrets --fail-on warning --format github > "$annotations" || status=$?
          if [ "$status" -ne 5 ]; then
            echo "expected exit code 5 for a policy failure, got $status"
            exit 1
          fi
          grep -q '^::warning ' "$annotations"
      - name: Serve the web interface
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/serve.log"
          ./target/release/repodna serve --port 7788 > "$log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:7788/api/health && break
            sleep 0.2
          done
          page=$(curl -fsS http://127.0.0.1:7788/)
          grep -q '<div id="root">' <<< "$page"
          notices=$(curl -fsS http://127.0.0.1:7788/THIRD-PARTY-NOTICES.txt)
          grep -q 'Third-party software in RepoDNA' <<< "$notices"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7788/api/repositories)" = 401
          token=$(grep -o 'token=[0-9a-f]*' "$log" | head -n 1 | cut -d= -f2)
          repositories=$(curl -fsS -H "X-RepoDNA-Token: $token" http://127.0.0.1:7788/api/repositories)
          grep -q polyglot <<< "$repositories"

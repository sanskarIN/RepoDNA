name: Publish RepoDNA v1.3.3 once

# Runs exactly when this release handoff is merged into main. The release's actual
# build and publishing are handled by the existing, separately tested release.yml.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v133.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-v1.3.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sanskarIN/RepoDNA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the exact version and release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "repodna-cli") | .version')" = "1.3.3"
          grep -Fqx '## [1.3.3] - 2026-10-15' CHANGELOG.md
          test "$(git branch --show-current || true)" != "release-v1.3.3-prep"
      - name: Create annotated v1.3.3 tag if absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.3.3; then
            actual=$(git rev-list -n 1 v1.3.3)
            test "$actual" = "$GITHUB_SHA" || { echo "v1.3.3 already exists at a different commit." >&2; exit 1; }
          else
            git config user.name "RepoDNA release maintenance"
            git config user.email "sanskarin@oulook.in"
            git tag -a v1.3.3 -m "RepoDNA 1.3.3"
            git push origin refs/tags/v1.3.3
          fi
      - name: Dispatch the existing release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub does not trigger other push workflows for GITHUB_TOKEN tag pushes.
          # A workflow_dispatch is allowed and builds the exact v1.3.3 tag.
          gh workflow run release.yml --ref main --field tag=v1.3.3

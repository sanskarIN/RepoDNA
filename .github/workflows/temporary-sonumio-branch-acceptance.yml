name: Temporary Sonumio branch acceptance

on:
  push:
    branches:
      - feat/revision-aware-remote-analysis-20261116

permissions:
  contents: read

jobs:
  sonumio-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Analyze real Sonumio branch URL
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -eu
          git ls-remote --heads https://github.com/sanskarIN/sonumio.git refs/heads/feat/initial-audio-platform | grep 'refs/heads/feat/initial-audio-platform'
          cargo run --locked -p repodna-cli --bin repodna -- analyze https://github.com/sanskarIN/sonumio/tree/feat/initial-audio-platform --profile standard --clone-depth 2 --no-store --format text > /tmp/sonumio-analysis.txt
          sed -n '1,60p' /tmp/sonumio-analysis.txt

name: Prepare v1.4.0 versions and native icons

on:
  push:
    branches: [release-v1.4.0-development]
    paths:
      - .github/workflows/prepare-v140.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v1.4.0-development
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Bump workspace versions without rewriting historical screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = [
              "Cargo.toml", "apps/desktop/src-tauri/Cargo.toml",
              "apps/desktop/src-tauri/tauri.conf.json",
          ]
          packages = [
              "package.json", "apps/web/package.json", "apps/desktop/package.json",
              "packages/schema/package.json", "packages/visualization/package.json",
              "packages/wasm/package.json",
          ]
          for item in cargo + packages:
              path = Path(item)
              text = path.read_text()
              if "1.3.3" not in text:
                  raise ValueError(f"{path}: old version not found")
              # These manifest files do not contain historical screenshot or release URLs.
              new = text.replace("1.3.3", "1.4.0")
              path.write_text(new)
              print(f"Prepared {item}")
          PY
      - name: Resolve Cargo and npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write \
            apps/web/src/App.tsx \
            apps/web/src/components/SplashScreen.tsx \
            apps/web/src/components/SplashScreen.test.tsx \
            apps/web/src/lib/links.ts \
            apps/web/src/styles.css
          node --test "packaging/npm/test/*.test.mjs"
      - name: Generate raster icons from the non-AI SVG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 -m pip install --break-system-packages --quiet Pillow==11.3.0
          rsvg-convert -w 1024 -h 1024 apps/web/public/favicon.svg -o /tmp/repodna-mark-1024.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open("/tmp/repodna-mark-1024.png").convert("RGBA")
          if source.size != (1024, 1024):
              raise ValueError(f"Unexpected SVG render size: {source.size}")
          web = Path("apps/web/public/icons")
          desktop = Path("apps/desktop/src-tauri/icons")
          for folder in (web, desktop):
              folder.mkdir(parents=True, exist_ok=True)
          resized = lambda size: source.resize((size, size), Image.Resampling.LANCZOS)
          for size in (192, 512):
              resized(size).save(web / f"icon-{size}.png")
          resized(180).save(web / "apple-touch-icon.png")
          mask = Image.new("RGBA", (512, 512), "#102338")
          artwork = resized(408)
          mask.alpha_composite(artwork, (52, 52))
          mask.convert("RGB").save(web / "icon-maskable-512.png")
          for filename, size in (
              ("32x32.png", 32),
              ("64x64.png", 64),
              ("128x128.png", 128),
              ("128x128@2x.png", 256),
              ("icon.png", 512),
          ):
              resized(size).save(desktop / filename)
          source.save(desktop / "icon.ico", format="ICO", sizes=[
              (16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)
          ])
          source.save(desktop / "icon.icns", format="ICNS")
          for p in [*web.glob("*.png"), *desktop.glob("*.png"), desktop / "icon.ico", desktop / "icon.icns"]:
              if p.stat().st_size < 100:
                  raise ValueError(f"Empty icon: {p}")
              print(p, p.stat().st_size)
          PY
      - name: Validate metadata and tests
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check
          npm run typecheck
          npm test -w @repodna/web
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          pkg = json.loads(Path("package.json").read_text())
          desktop = json.loads(Path("apps/desktop/src-tauri/tauri.conf.json").read_text())
          assert pkg["version"] == desktop["version"] == "1.4.0"
          manifest = json.loads(Path("apps/web/public/manifest.webmanifest").read_text())
          for icon in manifest["icons"]:
              path = Path("apps/web/public") / icon["src"]
              assert path.exists(), path
          for icon in desktop["bundle"]["icon"]:
              path = Path("apps/desktop/src-tauri") / icon
              assert path.exists(), path
          for path in Path("apps/web/public/icons").glob("*.png"):
              with Image.open(path) as image:
                  image.verify()
          for path in Path("apps/desktop/src-tauri/icons").glob("*.png"):
              with Image.open(path) as image:
                  image.verify()
          PY
          git diff --check
      - name: Commit prepared release files and icons
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock \
            apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/icons \
            package.json package-lock.json apps/web/package.json apps/desktop/package.json \
            packages/schema/package.json packages/visualization/package.json packages/wasm/package.json \
            apps/web/public/icons apps/web/src/App.tsx apps/web/src/components/SplashScreen.tsx \
            apps/web/src/components/SplashScreen.test.tsx apps/web/src/lib/links.ts apps/web/src/styles.css
          if git diff --cached --quiet; then
            echo "Already prepared."
            exit 0
          fi
          git config user.name "RepoDNA release maintenance"
          git config user.email "sanskarin@oulook.in"
          git commit -m "build(v1.4.0): synchronize versions and regenerate web/desktop branded icons"
          git push origin HEAD:release-v1.4.0-development
